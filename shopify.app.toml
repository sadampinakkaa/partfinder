# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "5ec5b77b080f4bb0370b32a2630f9ec3"
application_url = "https://partfinder.pinakkaa.com"
embedded = true
name = "Product Fit Finder by Pinakkaa"

[access_scopes]
scopes = "read_products,read_themes,write_products"

[auth]
redirect_urls = [
  "https://partfinder.pinakkaa.com/auth",
  "https://partfinder.pinakkaa.com/api/auth"
]

[app_proxy]
url = "https://partfinder.pinakkaa.com/api/storefront/fit-finder"
subpath = "fit-finder"
prefix = "apps"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [
    "customers/data_request",
    "customers/redact",
    "shop/redact"
  ]

[build]
automatically_update_urls_on_dev = true
